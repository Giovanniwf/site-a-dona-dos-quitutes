[build]
  publish = "dist"
  command = "npm run build"

[[headers]]
  for = "/images/optimized/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/logo-optimized.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[redirects]]
  from = "/images/Tortafundo.png"
  to = "/images/optimized/hero-torta.png"
  status = 301

[[redirects]]
  from = "/images/entrega.png"
  to = "/images/optimized/entrega.png"
  status = 301

[[redirects]]
  from = "/images/perfil2.png"
  to = "/images/optimized/sobre.png"
  status = 301

[[redirects]]
  from = "/images/produto1.jpg"
  to = "/images/optimized/produto1.jpg"
  status = 301

[[redirects]]
  from = "/images/produto2.jpg"
  to = "/images/optimized/produto2.jpg"
  status = 301

[[redirects]]
  from = "/images/produto3.jpg"
  to = "/images/optimized/produto3.jpg"
  status = 301

[[redirects]]
  from = "/images/produto4.jpg"
  to = "/images/optimized/produto4.jpg"
  status = 301

[[redirects]]
  from = "/logo.png"
  to = "/logo-optimized.png"
  status = 301
